# raises the rate limits so they never trip during a run, no backend code change
services:
  api:
    environment:
      MINT_ENV: bench-dynamo-cache
      MINT_CAP_GLOBAL_GET: "100000000"
      MINT_CAP_GLOBAL_POST: "100000000"
      MINT_CAP_IP_GET: "100000000"
      MINT_CAP_IP_POST: "100000000"
      MINT_CAP_USER_GET: "100000000"
      MINT_CAP_USER_POST: "100000000"
